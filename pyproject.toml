[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "htr"
version = "0.1.0"
description = "Handwritten text recognition research and application"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.33.0",
    "pillow>=9.4.0",
    "jiwer>=3.0.0",
    "evaluate>=0.4.0",
    "gradio>=4.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "datasets>=2.14.0",
    "pyarrow>=14.0.0",
    "matplotlib>=3.7.0",
    "pytesseract>=0.3.10",
]

[tool.setuptools.packages.find]
where = ["src"]
